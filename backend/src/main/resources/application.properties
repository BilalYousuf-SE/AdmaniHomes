spring.application.name=realestate-backend

# ---- Database (Postgres) ----
# All values come from environment variables so nothing sensitive is committed to git.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/realestate}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Server ----
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- JWT ----
# Must be overridden in production with a long, random secret (>= 32 chars).
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-value-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# ---- CORS ----
# Comma-separated list of allowed frontend origins, e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Initial admin seed (only runs once, first boot) ----
app.admin.seed-username=${ADMIN_USERNAME:}
app.admin.seed-password=${ADMIN_PASSWORD:}

# ---- Cloudinary (media uploads) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ---- File upload limits (matches UploadController's own checks) ----
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---- Health check (used by hosting platforms) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Misc ----
spring.jackson.default-property-inclusion=non_null
